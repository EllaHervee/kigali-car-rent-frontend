services:
  - type: web
    name: kigali-car-rent-frontend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: BACKEND_URL
        sync: false
