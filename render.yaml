services:
  - type: web
    name: kigali-car-rent
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: KCR_DATA_DIR
        value: ./data
